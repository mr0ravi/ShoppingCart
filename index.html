<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="فروشگاه دسر">
  <title>فروشگاه دسر</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container shop-box py-5">
    <div class="row g-4 align-items-start">
      <section class="col-12 col-lg-8">
        <div class="section-heading">
          <span class="top-title d-inline-block fw-semibold">منوی شیرین امروز</span>
          <h1 class="page-title m-0 fw-bolder">دسرها</h1>
        </div>
        <div id="productGrid" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4"></div>
      </section>

      <aside class="col-12 col-lg-4">
        <div class="cart-card position-sticky">
          <div class="d-flex align-items-center justify-content-center gap-1">
            <h2 class="m-0 fw-bolder">سبد خرید <span id="cartCount">(0)</span></h2>
            <span class="cart-badge d-grid rounded-circle"><i class="bi bi-bag-heart"></i></span>
          </div>

          <div id="emptyCart" class="empty-cart d-flex flex-column justify-content-center align-items-center gap-1 text-center">
            <div class="cake-icon lh-1"><i class="bi bi-cake2-fill"></i></div>
            <p class="m-0">محصولات انتخابی شما اینجا نمایش داده می‌شوند</p>
          </div>

          <div id="cartItems" class="d-none"></div>

          <div id="cartSummary" class="cart-summary d-none">
            <div class="summary-row d-flex justify-content-between align-items-center">
              <span>مجموع سفارش</span>
              <strong id="cartTotal">0 ریال</strong>
            </div>
            <button class="checkout-btn w-100 border-0 text-white fw-bold" type="button">ادامه و پرداخت</button>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
